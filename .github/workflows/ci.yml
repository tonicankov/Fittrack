name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FitTrack.slnx

      - name: Build
        run: dotnet build FitTrack.slnx --no-restore -c Release

      # Integration tests start MySQL through Testcontainers (Docker is preinstalled on the runner)
      - name: Test
        run: dotnet test FitTrack.slnx --no-build -c Release --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: TestResults

  web:
    name: Web client build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build

      # Goes through nginx like a browser would: health, the app, registration with the bootstrap invite
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/health | grep -q Healthy
          curl -fs http://localhost:8080/progress | grep -q 'id="root"'
          CODE=$(docker compose logs api | grep -oE 'invite code [A-Z0-9]+' | head -1 | awk '{print $3}')
          TOKEN=$(curl -fs -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"inviteCode\":\"$CODE\",\"email\":\"ci@example.com\",\"displayName\":\"CI\",\"password\":\"password123\"}" \
            | jq -r .accessToken)
          curl -fs http://localhost:8080/api/me -H "Authorization: Bearer $TOKEN" | jq -e '.displayName == "CI"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
